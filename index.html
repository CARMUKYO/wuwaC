<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fbf4f1" />
    <script>
      try {
        var t = localStorage.getItem('wuwa-theme');
        if (t === 'ink' || t === 'paper') {
          document.documentElement.dataset.theme = t;
          if (t === 'ink') document.querySelector('meta[name="theme-color"]').content = '#1a1726';
        }
      } catch (e) {}
    </script>
    <meta
      name="description"
      content="WuWa Optimizer — a local-first Echo inventory and damage optimizer for Wuthering Waves."
    />
    <title>WuWa Optimizer</title>
    <link rel="canonical" href="https://carmukyo.github.io/wuwaC/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="WuWa Optimizer" />
    <meta
      property="og:description"
      content="Local-first Echo inventory and damage optimizer for Wuthering Waves. Your data stays in your browser."
    />
    <meta property="og:url" content="https://carmukyo.github.io/wuwaC/" />
    <meta property="og:image" content="https://carmukyo.github.io/wuwaC/aemeath-ames-still.png" />
    <meta name="twitter:card" content="summary" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
